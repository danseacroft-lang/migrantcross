name: Update crossing figures

on:
  schedule:
    - cron: "30 10 * * *"   # every day at 10:30 UTC (11:30 UK summer time)
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas lxml odfpy requests pillow
      - run: python scripts/update.py
      - name: Commit new figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json og-image.png index.html
          git diff --cached --quiet || git commit -m "Update crossing figures"
          git push
