name: Probe asylum tables
on:
  push:
    branches: [claude/asylum-probe]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: {ref: claude/project-thread-gg3te9}
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - shell: python
        run: |
          import sys, json; sys.path.insert(0, "scripts")
          import extras
          extras.update_boat_returns(json.load(open("data.json"))["days"]); print(open("boatreturns.json").read())
