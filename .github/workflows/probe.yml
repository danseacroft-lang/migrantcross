name: Probe asylum tables
on:
  push:
    branches: [claude/asylum-probe]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install openpyxl requests
      - shell: python
        run: |
          import io, requests, openpyxl
          u = "https://assets.publishing.service.gov.uk/media/6a85c41d3d82f78d5c514551/illegal-entry-routes-to-the-uk-dataset-jun-2026.xlsx"
          wb = openpyxl.load_workbook(io.BytesIO(requests.get(u, timeout=180).content), read_only=True, data_only=True)
          for ws in wb.worksheets:
              print("=== SHEET", ws.title)
              for i, r in enumerate(ws.iter_rows(values_only=True)):
                  if i > 14: break
                  print(i, r)
          from collections import Counter
          for code in ("d02", "d03"):
              ws = next(s for s in wb.worksheets if code in s.title.lower())
              rows = list(ws.iter_rows(values_only=True))
              hi = next(i for i, r in enumerate(rows) if r and sum(1 for c in r if c) > 5)
              head = rows[hi]; print("HEAD", code, head)
              for j, h in enumerate(head):
                  vals = Counter(r[j] for r in rows[hi+1:] if r and len(r) > j)
                  if len(vals) < 40: print(" ", h, dict(vals))
                  else: print(" ", h, len(vals), "distinct, e.g.", list(vals)[:8])
