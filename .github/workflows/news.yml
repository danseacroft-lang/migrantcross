name: Update breaking news

on:
  schedule:
    - cron: "10 * * * *"   # every hour, at 10 past
  workflow_dispatch:

permissions:
  contents: write

concurrency: publish      # never push at the same moment as the daily figures update

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/news.py
      - name: Publish news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet && exit 0
          git commit -m "Update breaking news"
          git pull --rebase && git push
