<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Channel Crossings · Latest</title>
<style>
:root{--bg:#FFFFFF;--label:#000;--label2:rgba(60,60,67,.74);--blue:#007AFF;--green:#248A3D;--red:#D70015;--sep:rgba(60,60,67,.22)}
@media (prefers-color-scheme:dark){:root{--bg:#1C1C1E;--label:#fff;--label2:rgba(235,235,245,.6);--blue:#0A84FF;--green:#30D158;--red:#FF453A;--sep:rgba(84,84,88,.6)}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--label);font:15px/1.35 "Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a.card{display:flex;flex-direction:column;justify-content:space-between;height:100%;padding:14px 16px;color:inherit;text-decoration:none}
.top{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.top svg{width:22px;height:22px;border-radius:50%;flex:none}
.big{font-size:40px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.sub{color:var(--label2);font-size:13px}
.row{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--sep);padding-top:8px;font-size:13px}
.row b{font-variant-numeric:tabular-nums}
.down{color:var(--green)}.up{color:var(--red)}
.more{color:var(--blue)}
</style>
</head>
<body>
<a class="card" href="https://channelcrossings.world/" target="_blank" rel="noopener">
  <div class="top">
    <svg viewBox="0 0 400 400" aria-hidden="true"><circle cx="200" cy="200" r="200" fill="#007AFF"/><path d="M302.9 149.1 A72 72 0 1 0 302.9 250.9" fill="none" stroke="#FF9F0A" stroke-width="30" stroke-linecap="round"/><path d="M218.9 149.1 A72 72 0 1 0 209.3 259.0" fill="none" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round"/><path d="M239.5 270.9 A72 72 0 0 1 184.3 224.6" fill="none" stroke="#007AFF" stroke-width="44" stroke-linecap="butt"/><path d="M243.2 271.5 A72 72 0 0 1 183.1 221.1" fill="none" stroke="#FF9F0A" stroke-width="30" stroke-linecap="butt"/></svg>
    Channel Crossings
  </div>
  <div>
    <div class="big" id="n">–</div>
    <div class="sub" id="d">Loading the latest figures…</div>
  </div>
  <div class="row"><span id="yl">Year so far</span><b id="y">–</b></div>
  <div class="row"><span class="sub">Home Office figures</span><span class="more">Full figures ›</span></div>
</a>
<script>
(async function(){
  var $ = function(id){ return document.getElementById(id); };
  var fmt = function(n){ return Number(n).toLocaleString("en-GB"); };
  try{
    var data = await (await fetch("recent.json")).json();
    var days = data.days, last = days[days.length-1], yr = last.date.slice(0,4);
    var when = new Date(last.date + "T00:00:00Z").toLocaleDateString("en-GB", {weekday:"short", day:"numeric", month:"short", timeZone:"UTC"});
    $("n").textContent = fmt(last.migrants);
    $("d").textContent = last.migrants === 0 ? "No crossings detected on " + when : (last.migrants === 1 ? "person" : "people") + " crossed on " + when;
    var ytd = data.ytdBase + days.filter(function(d){ return d.date > data.ytdBaseDate && d.date.slice(0,4) === yr; }).reduce(function(s,d){ return s + d.migrants; }, 0);
    $("yl").textContent = yr + " so far";
    $("y").textContent = fmt(ytd);
    if(data.prevYearSamePoint){
      var pct = Math.round((ytd/data.prevYearSamePoint - 1)*100);
      var sp = document.createElement("span"); sp.className = pct < 0 ? "down" : "up";
      sp.textContent = " " + (pct < 0 ? "↓" : "↑") + Math.abs(pct) + "%";
      $("y").append(sp);
    }
  }catch(e){ $("d").textContent = "Tap for the latest figures"; }
})();
</script>
</body>
</html>
