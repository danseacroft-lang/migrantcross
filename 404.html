<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- GitHub Pages shows this for any address that doesn't exist, such as the retired beta.html and classic.html:
     it sends visitors straight on to the homepage -->
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="2; url=/">
<title>Page not found · Channel Crossings</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{color-scheme:light dark;--bg:#F2F2F7;--label:#000;--label2:rgba(60,60,67,.6);--blue:#007AFF}
@media (prefers-color-scheme:dark){:root{--bg:#000;--label:#fff;--label2:rgba(235,235,245,.6);--blue:#0A84FF}}
body{margin:0;min-height:100svh;display:grid;place-items:center;background:var(--bg);color:var(--label);
  font:17px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;text-align:center;padding:24px}
h1{font-size:1.4rem;margin:0 0 6px}
p{margin:0;color:var(--label2)}
a{color:var(--blue);text-decoration:none;font-weight:600}
</style>
<script>location.replace("/" + location.hash);</script>
</head>
<body><main><h1>Page not found</h1><p>Taking you to <a href="/">Channel Crossings</a>…</p></main></body>
