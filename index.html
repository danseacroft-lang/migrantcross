.info-pop.sheet{overflow:auto;overscroll-behavior:contain;border-radius:20px;padding:16px 18px}
.info-pop.sheet > :first-child{padding-right:34px}   /* room for the close button */
/* the close button on a phone sheet: it floats over the sheet's top right corner, so it stays put while the sheet scrolls */
.pop-x{position:fixed;z-index:62;width:30px;height:30px;border:0;border-radius:50%;background:var(--fill2);color:var(--label);display:grid;place-items:center;cursor:pointer;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.pop-x svg{width:10px;height:10px}
.pop-x[hidden]{display:none}
.info-pop:not([hidden]){animation:popIn .26s cubic-bezier(.2,.9,.3,1.15) both;transform-origin:var(--from,bottom left)}
@keyframes popIn{from{opacity:0;transform:scale(.92)}}
.fu-pop{overflow:hidden;isolation:isolate}
.lx-pop{width:min(340px,calc(100vw - 32px));padding:16px;border-radius:18px}
.wp-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:14px 0 12px}
.wp-stats div{background:var(--fill);border-radius:12px;padding:8px 10px;white-space:nowrap}
.wp-stats span{display:block;font-size:.647rem;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.04em}
.wp-stats b{display:inline;margin:0;font:700 1.12rem/1.2 var(--round);color:var(--label)}
.wp-stats small{font-size:.706rem;font-weight:600;color:var(--label2)}
