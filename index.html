<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <style>
    /* Base resets & CSS custom properties */
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --accent: #38bdf8;
      --shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
    }

    /* Main Container Layout */
    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 36px max(16px, env(safe-area-inset-right, 0px)) 60px max(16px, env(safe-area-inset-left, 0px));
      display: grid;
      gap: 40px;
    }

    /* Bento Grid: Strict 2-Column Layout */
    .bento, .duo {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      width: 100%;
    }

    .b-week, .b-ring {
      grid-column: span 1;
      grid-row: span 1;
    }

    /* Card Item Containment */
    .card {
      background: var(--card);
      border-radius: 22px;
      box-shadow: var(--shadow);
      padding: 18px;
      position: relative;
      overflow: hidden; /* Prevents child elements from spilling out horizontally */
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
      min-width: 0; /* Ensures CSS Grid children respect grid boundaries */
      display: flex;
      flex-direction: column;
    }

    /* Restrain internal SVGs & Charts from blowing out card width */
    .card svg, .spark svg, .chart svg, .pb-line svg {
      max-width: 100%;
      height: auto;
      display: block;
    }

    /* Inner horizontal scroll wrappers for wide dynamic components */
    .heat-scroll, .yr, .pb-boats {
      max-width: 100%;
      overflow-x: auto;
      box-sizing: border-box;
    }

    /* Responsive single-column fallback for mobile/tablets */
    @media (max-width: 768px) {
      .bento, .duo {
        grid-template-columns: 1fr;
      }
      
      .b-week, .b-ring {
        grid-column: span 1;
      }
    }
  </style>
</head>
<body>

  <main>
    <section class="bento">
      <div class="card b-week">
        <h2>Weekly Overview</h2>
        <p>Content stays tightly bounded within Column 1.</p>
      </div>

      <div class="card b-ring">
        <h2>Activity Ring</h2>
        <div class="heat-scroll">
          <p>Extensible content expands vertically without breaking column width.</p>
        </div>
      </div>
    </section>

    <section class="duo">
      <div class="card">
        <h2>Analytics</h2>
        <p>Column 1 content.</p>
      </div>

      <div class="card">
        <h2>Performance</h2>
        <p>Column 2 content.</p>
      </div>
    </section>
  </main>

</body>
</html>
