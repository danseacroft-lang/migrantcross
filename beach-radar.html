<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- Private for now: not linked from the site, not in the sitemap, and search engines are asked not to list it -->
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<script>try{var t=localStorage.getItem("cc-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<title>Beach Radar · Channel Crossings</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  color-scheme:light;
  --bg:#F2F2F7; --label:#000; --label2:rgba(60,60,67,.74); --fill:rgba(118,118,128,.12);
  --blue:#007AFF; --green:#34C759;
  --glass:rgba(255,255,255,.72); --glass-edge:rgba(255,255,255,.8);
  --shadow:0 18px 50px rgba(0,0,0,.16),0 2px 6px rgba(0,0,0,.06);
  --sky1:#9FD2FF; --sky2:#E6F4FF; --sea1:#3E9BE0; --sea2:#1B6FB5; --sea3:#155A94;
  --sand1:#F0DDB3; --sand2:#DDBF86; --wet:#C9AA73; --foam:#FFFFFF;
  --chalk1:#FBFAF4; --chalk2:#D9D5C7; --grass:#7DBB5A; --sun:#FFD23F;
  --radar:52,199,89;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#000; --label:#fff; --label2:rgba(235,235,245,.6); --fill:rgba(118,118,128,.24); --blue:#0A84FF; --green:#30D158;
  --glass:rgba(38,38,40,.66); --glass-edge:rgba(255,255,255,.1); --shadow:0 18px 50px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.3);
  --sky1:#050B18; --sky2:#12294A; --sea1:#12406B; --sea2:#0A2A4A; --sea3:#061C33;
  --sand1:#7C6A4B; --sand2:#5E4F36; --wet:#4B3F2B; --foam:#A9CDEE;
  --chalk1:#BDB9AD; --chalk2:#7F7B70; --grass:#3F6B2E; --sun:#F4F1D8; --radar:48,209,88;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#000; --label:#fff; --label2:rgba(235,235,245,.6); --fill:rgba(118,118,128,.24); --blue:#0A84FF; --green:#30D158;
  --glass:rgba(38,38,40,.66); --glass-edge:rgba(255,255,255,.1); --shadow:0 18px 50px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.3);
  --sky1:#050B18; --sky2:#12294A; --sea1:#12406B; --sea2:#0A2A4A; --sea3:#061C33;
  --sand1:#7C6A4B; --sand2:#5E4F36; --wet:#4B3F2B; --foam:#A9CDEE;
  --chalk1:#BDB9AD; --chalk2:#7F7B70; --grass:#3F6B2E; --sun:#F4F1D8; --radar:48,209,88;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--label);font:17px/1.35 var(--font);letter-spacing:-.022em;-webkit-font-smoothing:antialiased;overflow:hidden}

/* ---- Top bar ---- */
.bar{position:fixed;inset:0 0 auto;z-index:5;display:flex;align-items:center;gap:12px;
  padding:max(10px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left))}
.home{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px 0 10px;border-radius:22px;text-decoration:none;
  color:var(--blue);font:600 15px/1 var(--font);background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  box-shadow:0 0 0 .5px var(--glass-edge)}
.home svg{width:18px;height:18px}
.home:focus-visible,.btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ---- The scene: comes in like a wave, settles, then sinks into the background ---- */
.scene{position:fixed;inset:0;animation:sink 1.4s cubic-bezier(.4,0,.2,1) 5.2s both}
.scene svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.scene::after{content:"";position:absolute;inset:0;pointer-events:none;   /* soft edges, so it melts into the page */
  background:radial-gradient(120% 90% at 50% 55%,transparent 55%,var(--bg) 100%),linear-gradient(to bottom,var(--bg) 0,transparent 16%,transparent 84%,var(--bg) 100%)}
@keyframes sink{to{opacity:.32;transform:scale(1.04)}}
.settle{transform-origin:50% 60%;animation:settle 2.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes settle{from{transform:scale(1.12) translateY(3%)}to{transform:none}}
.wave-in{animation:waveIn 1.9s cubic-bezier(.22,.9,.25,1) both}
@keyframes waveIn{from{transform:translateY(105%)}to{transform:translateY(-30%)}}
.crest{animation:crest 1.2s ease-in-out infinite alternate}
@keyframes crest{from{transform:translateX(-120px)}to{transform:translateX(0)}}
.surf{animation:surf 5s ease-in-out infinite}
.surf.s2{animation-delay:-2.5s;opacity:.6}
@keyframes surf{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
.swell{animation:swell 9s ease-in-out infinite alternate}
@keyframes swell{from{transform:translateX(-40px)}to{transform:translateX(40px)}}
.bob{transform-box:fill-box;transform-origin:center;animation:bob 3.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(4px) rotate(-3deg)}}

/* ---- Radar ---- */
.radar{position:absolute;left:50%;top:60%;width:min(92vmin,760px);aspect-ratio:1;translate:-50% -50%;border-radius:50%;
  opacity:0;animation:radarIn .8s ease-out 1.3s both;
  -webkit-mask-image:radial-gradient(circle,#000 60%,transparent 71%);mask-image:radial-gradient(circle,#000 60%,transparent 71%)}
@keyframes radarIn{to{opacity:1}}
.sweep{position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,rgba(var(--radar),0) 0deg,rgba(var(--radar),0) 270deg,rgba(var(--radar),.38) 358deg,rgba(var(--radar),.9) 360deg);
  animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rings{position:absolute;inset:0;width:100%;height:100%}
.rings circle,.rings line{fill:none;stroke:rgba(var(--radar),.55);stroke-width:1.2;vector-effect:non-scaling-stroke}
.rings .faint{stroke:rgba(var(--radar),.28)}
.blip{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:rgb(var(--radar));
  box-shadow:0 0 14px 4px rgba(var(--radar),.7);opacity:0;animation:ping 4s linear infinite}
.blip::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1.5px solid rgba(var(--radar),.8);opacity:0;animation:ring 4s ease-out infinite;animation-delay:inherit}
@keyframes ping{0%{opacity:1;transform:scale(1.3)}8%{transform:scale(1)}45%{opacity:.35}70%,100%{opacity:0}}
@keyframes ring{0%{opacity:.9;transform:scale(.6)}30%,100%{opacity:0;transform:scale(2.6)}}

/* ---- The notice ---- */
.notice{position:fixed;left:50%;top:50%;z-index:4;width:min(420px,calc(100vw - 32px));translate:-50% -50%;
  padding:28px 24px 22px;border-radius:24px;text-align:center;display:grid;justify-items:center;gap:10px;
  background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  box-shadow:var(--shadow),0 0 0 .5px var(--glass-edge);animation:appear .7s cubic-bezier(.2,.9,.3,1.15) 5.6s both}
@keyframes appear{from{opacity:0;transform:scale(.92) translateY(14px)}to{opacity:1;transform:none}}
.badge{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(160deg,#4CD964,#1E9E45);box-shadow:0 6px 18px rgba(52,199,89,.35)}
.badge svg{width:36px;height:36px;overflow:visible}
.badge .arm{transform-origin:18px 18px;animation:spin 3s linear infinite}
.pill{font:600 12px/1 var(--font);letter-spacing:.02em;text-transform:uppercase;color:var(--green);background:rgba(var(--radar),.15);padding:5px 10px;border-radius:999px}
h1{margin:0;font:700 28px/1.15 var(--font);letter-spacing:.01em}
.notice p{margin:0;color:var(--label2);font-size:17px;max-width:32ch}
.btn{margin-top:8px;display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 24px;border-radius:14px;
  background:var(--blue);color:#fff;text-decoration:none;font:600 17px/1 var(--font)}
@media (hover:hover){.btn:hover,.home:hover{filter:brightness(1.08)}}

/* Accessibility settings */
@media (prefers-reduced-transparency:reduce){.notice,.home{background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;animation-iteration-count:1!important}
  .sweep{background:conic-gradient(from 0deg,rgba(var(--radar),0) 0 300deg,rgba(var(--radar),.3) 360deg)}
  .blip{opacity:.8}
}
</style>
</head>
<body>
<header class="bar">
  <a class="home" href="./"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Channel Crossings</a>
</header>

<div class="scene" aria-hidden="true">
  <svg id="beach" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--sky1)"/><stop offset="1" stop-color="var(--sky2)"/></linearGradient>
      <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--sea3)"/><stop offset=".5" stop-color="var(--sea2)"/><stop offset="1" stop-color="var(--sea1)"/></linearGradient>
      <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--wet)"/><stop offset=".18" stop-color="var(--sand2)"/><stop offset="1" stop-color="var(--sand1)"/></linearGradient>
      <linearGradient id="chalk" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="var(--chalk2)"/><stop offset=".35" stop-color="var(--chalk1)"/><stop offset="1" stop-color="var(--chalk2)"/></linearGradient>
      <radialGradient id="sunGlow"><stop offset=".25" stop-color="var(--sun)" stop-opacity=".9"/><stop offset="1" stop-color="var(--sun)" stop-opacity="0"/></radialGradient>
      <!-- The wave that brings the picture in -->
      <mask id="reveal" maskUnits="userSpaceOnUse" x="0" y="0" width="1600" height="900">
        <g class="wave-in"><g class="crest">
          <path fill="#fff" d="M-200 120 C-60 40 60 40 200 120 S460 200 600 120 860 40 1000 120 1260 200 1400 120 1660 40 1800 120 V2200 H-200Z"/>
        </g></g>
      </mask>
    </defs>
    <g mask="url(#reveal)"><g class="settle">
      <rect width="1600" height="900" fill="url(#sky)"/>
      <circle cx="1180" cy="170" r="150" fill="url(#sunGlow)"/><circle cx="1180" cy="170" r="46" fill="var(--sun)" opacity=".95"/>
      <!-- sea -->
      <rect y="380" width="1600" height="520" fill="url(#sea)"/>
      <g class="swell" fill="none" stroke="var(--foam)" stroke-linecap="round" opacity=".35" stroke-width="3">
        <path d="M60 430q40-10 80 0t80 0M420 470q50-12 100 0t100 0M900 440q40-10 80 0t80 0M300 540q60-14 120 0t120 0M1000 520q50-12 100 0t100 0M620 600q60-14 120 0t120 0"/>
      </g>
      <!-- a small boat far out -->
      <g class="bob"><g transform="translate(1040 468)">
        <path d="M-34 0h62q10 0 10 7t-10 7h-58q-9 0-12-7t8-7z" fill="#39424E"/>
        <g fill="#FF9500"><circle cx="-20" cy="-6" r="5"/><circle cx="-6" cy="-7" r="5"/><circle cx="8" cy="-6" r="5"/><circle cx="21" cy="-6" r="5"/></g>
      </g></g>
      <!-- white cliffs -->
      <path d="M1600 380 V250 L1470 262 L1360 300 L1300 330 L1250 380Z" fill="url(#chalk)"/>
      <path d="M1600 250 L1470 262 L1360 300 L1300 330 L1320 322 L1375 294 L1480 256 L1600 244Z" fill="var(--grass)"/>
      <path d="M1250 380 L1300 330 L1320 380Z" fill="var(--chalk2)" opacity=".6"/>
      <!-- beach -->
      <path d="M0 650 C300 610 520 690 820 660 S1320 600 1600 650 V900 H0Z" fill="url(#sand)"/>
      <g class="surf"><path d="M0 646 C300 606 520 686 820 656 S1320 596 1600 646" fill="none" stroke="var(--foam)" stroke-width="7" stroke-linecap="round" opacity=".85"/></g>
      <g class="surf s2"><path d="M0 668 C300 628 520 708 820 678 S1320 618 1600 668" fill="none" stroke="var(--foam)" stroke-width="4" stroke-linecap="round"/></g>
      <g fill="var(--sand2)" opacity=".5"><ellipse cx="300" cy="790" rx="60" ry="6"/><ellipse cx="1100" cy="820" rx="90" ry="7"/><ellipse cx="760" cy="760" rx="40" ry="4"/></g>
    </g></g>
  </svg>

  <div class="radar">
    <div class="sweep"></div>
    <svg class="rings" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46"/><circle class="faint" cx="50" cy="50" r="34"/><circle class="faint" cx="50" cy="50" r="22"/><circle class="faint" cx="50" cy="50" r="10"/><line class="faint" x1="50" y1="4" x2="50" y2="96"/><line class="faint" x1="4" y1="50" x2="96" y2="50"/></svg>
    <!-- blips light up as the sweep passes them (delay = angle / 360 × 4s) -->
    <i class="blip" style="left:22%;top:38%;animation-delay:3.26s"></i>
    <i class="blip" style="left:66%;top:30%;animation-delay:.39s"></i>
    <i class="blip" style="left:74%;top:62%;animation-delay:1.29s"></i>
    <i class="blip" style="left:36%;top:70%;animation-delay:2.48s"></i>
  </div>
</div>

<script>
  // Tall screens (phones): frame the right-hand part of the beach, so the sun, cliffs and boat stay in view
  (function(){ var b = document.getElementById("beach");
    function fit(){ b.setAttribute("viewBox", innerWidth < innerHeight * .9 ? "780 0 820 900" : "0 0 1600 900"); }
    fit(); addEventListener("resize", fit); })();
</script>

<main class="notice" role="status">
  <div class="badge" aria-hidden="true"><svg viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
    <circle cx="18" cy="18" r="15"/><circle cx="18" cy="18" r="8.5" opacity=".6"/><path class="arm" d="M18 18L18 3"/><circle cx="25" cy="11" r="2.2" fill="currentColor" stroke="none"/></svg></div>
  <span class="pill">Coming soon</span>
  <h1>Beach Radar</h1>
  <p>Beach Radar is currently unavailable but will be live soon.</p>
  <a class="btn" href="./">Back to the figures</a>
</main>
</body>
</html>
